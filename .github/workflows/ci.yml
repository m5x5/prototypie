name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version; rustup installs it on first use.
      - name: Toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native
      - name: Check
        run: cargo check --workspace --tests
      - name: Test
        run: |
          cargo test -p proto-core
          cargo test -p proto-server
          cargo test -p proto-ai
          cargo test -p proto-web
          cargo test -p proto-app

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
