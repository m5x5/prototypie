[package]
name = "proto-web"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
rune.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSError", "NSGeometry", "NSValue", "NSDictionary", "NSArray", "NSThread", "NSRunLoop", "NSDate", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSView", "NSImage", "NSGraphics", "NSResponder", "NSRunningApplication", "NSGraphicsContext", "NSEvent"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKSnapshotConfiguration", "WKNavigationDelegate", "WKNavigation", "WKContentWorld", "WKFrameInfo", "WKPreferences", "WKUserContentController", "WKUserScript", "WKScriptMessage", "WKScriptMessageHandler", "objc2-app-kit", "block2"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGContext", "CGBitmapContext", "CGColorSpace"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
dispatch2 = "0.3"

[dev-dependencies]
png = "0.17"
